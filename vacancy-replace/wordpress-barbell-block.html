<div class="spv-press" data-spv-press>
  <div class="spv-press__stage">
    <div class="spv-press__sign">
      <span class="spv-press__small">Space</span>
      <span class="spv-press__big">Available</span>
    </div>
    <div class="spv-press__rig">
      <img class="spv-press__logo" src="/wp-content/uploads/2026/09/Powerhouse-Logo.png" alt="Powerhouse Gym">
      <svg class="spv-press__barbell" viewBox="0 0 1000 250" aria-hidden="true">
        <defs>
          <linearGradient id="spvSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset=".45" stop-color="#a9afb6"/><stop offset=".55" stop-color="#8b9199"/><stop offset="1" stop-color="#4c5157"/></linearGradient>
          <linearGradient id="spvChrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#cfd4d9"/><stop offset=".6" stop-color="#7d838a"/><stop offset="1" stop-color="#3e4247"/></linearGradient>
          <linearGradient id="spvRubber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#151618"/><stop offset=".3" stop-color="#34373b"/><stop offset=".55" stop-color="#26282b"/><stop offset="1" stop-color="#0e0f10"/></linearGradient>
          <pattern id="spvKnurl" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H4" stroke="rgba(0,0,0,.28)" stroke-width="1"/></pattern>
        </defs>
        <!-- shaft with knurling -->
        <rect x="190" y="118" width="620" height="14" fill="url(#spvSteel)"/>
        <rect x="300" y="118" width="170" height="14" fill="url(#spvKnurl)"/>
        <rect x="530" y="118" width="170" height="14" fill="url(#spvKnurl)"/>
        <!-- sleeves -->
        <rect x="14" y="111" width="176" height="28" rx="3" fill="url(#spvChrome)"/>
        <rect x="810" y="111" width="176" height="28" rx="3" fill="url(#spvChrome)"/>
        <!-- inner collars -->
        <rect x="186" y="101" width="12" height="48" rx="2" fill="url(#spvChrome)"/>
        <rect x="802" y="101" width="12" height="48" rx="2" fill="url(#spvChrome)"/>
        <!-- 45 lb plates -->
        <rect x="144" y="4" width="40" height="242" rx="7" fill="url(#spvRubber)"/>
        <rect x="816" y="4" width="40" height="242" rx="7" fill="url(#spvRubber)"/>
        <!-- 25 lb plates -->
        <rect x="110" y="42" width="31" height="166" rx="6" fill="url(#spvRubber)"/>
        <rect x="859" y="42" width="31" height="166" rx="6" fill="url(#spvRubber)"/>
        <!-- spring clips -->
        <rect x="94" y="107" width="13" height="36" rx="3" fill="#2a2c2f"/>
        <rect x="893" y="107" width="13" height="36" rx="3" fill="#2a2c2f"/>
        <!-- plate edge highlights -->
        <path d="M150 12V238M822 12V238M116 50V200M865 50V200" stroke="rgba(255,255,255,.07)" stroke-width="3"/>
      </svg>
    </div>
  </div>
  <canvas class="spv-press__fx" aria-hidden="true"></canvas>
</div>
<style>
  .spv-press { position: relative; max-width: 360px; margin: 0 auto 24px; }
  .spv-press__stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }
  .spv-press__sign { position: absolute; left: 0; right: 0; top: 4%; bottom: 4%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #b5b9be; border-radius: 4px; background: #f4f5f6; color: #8a8f96; text-transform: uppercase; line-height: 1; }
  .spv-press__small { font-size: 13px; letter-spacing: .35em; font-weight: 600; }
  .spv-press__big { font-size: clamp(26px, 6vw, 40px); font-weight: 800; letter-spacing: .06em; margin-top: 8px; }
  .spv-press__rig { position: absolute; inset: 0; transform: translateY(105%); }
  /* the logo rests on the bar: its bottom edge (68%) meets the top of the shaft */
  .spv-press__logo { position: absolute; left: 17%; top: 6%; width: 66%; height: 62%; object-fit: contain; object-position: 50% 100%; margin: 0; z-index: 1; }
  .spv-press__barbell { position: absolute; left: 0; top: 47%; width: 100%; height: 44.4%; overflow: visible; }
  .spv-press__fx { position: absolute; left: 0; top: -20%; width: 100%; height: 140%; pointer-events: none; z-index: 3; }
  @media (prefers-reduced-motion: reduce) {
    .spv-press__sign, .spv-press__barbell { display: none; }
    .spv-press__rig { transform: translateY(13%); }
  }
</style>
<script>
  (function () {
    var HOLD_MS = 1000;   // how long it must be fully in view before the lift starts
    var SPEED = 1;        // 1.5 = everything 50% slower, 0.8 = faster

    // The press, as [time to get there (ms), height, hold-and-strain?].
    // Height is how far below its final spot the rig sits, in stage-heights (0 = locked out).
    var REPS = [
      [450, 1.05],          // under the sign, out of view
      [550, .55],           // rep 1: press up into the sign
      [220, .55, true],     //   strain at the top
      [450, .72],           //   lower
      [550, .28],           // rep 2: higher
      [220, .28, true],
      [450, .42],
      [650, 0],             // final press: lockout, the sign is shoved off
      [550, 0, true]        // hold the lockout
    ];
    var DROP = 450;         // then the bar drops away, leaving the logo
    var SETTLE = .13;       // and the logo eases down to sit centered

    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    function ease(k) { return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }

    function dust(el) {
      // a low puff along the bottom edge when the bar hits the floor out of view
      var canvas = el.querySelector('.spv-press__fx');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.offsetWidth, h = canvas.offsetHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var s = w / 360, ground = h * (1.2 / 1.4), puffs = [];
      for (var i = 0; i < 40; i++) {
        var x = w * (.08 + Math.random() * .84), dir = x < w / 2 ? -1 : 1;
        puffs.push({ x: x, y: ground, vx: dir * Math.random() * 1.6 * s, vy: -(.3 + Math.random() * 1) * s,
          r: (4 + Math.random() * 6) * s, grow: .25 * s, a: .22, life: 1, decay: .012 + Math.random() * .01 });
      }
      (function frame() {
        ctx.clearRect(0, 0, w, h);
        for (var i = puffs.length - 1; i >= 0; i--) {
          var p = puffs[i];
          p.vx *= .95; p.vy *= .97; p.x += p.vx; p.y += p.vy; p.r += p.grow; p.life -= p.decay;
          if (p.life <= 0) { puffs.splice(i, 1); continue; }
          var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
          g.addColorStop(0, 'rgba(158,146,128,' + (p.a * p.life) + ')');
          g.addColorStop(1, 'rgba(158,146,128,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        if (puffs.length) requestAnimationFrame(frame); else ctx.clearRect(0, 0, w, h);
      })();
    }

    function play(el) {
      var stage = el.querySelector('.spv-press__stage');
      var sign = el.querySelector('.spv-press__sign');
      var rig = el.querySelector('.spv-press__rig');
      var barbell = el.querySelector('.spv-press__barbell');
      var logo = el.querySelector('.spv-press__logo');
      // where the visible logo starts inside its box (it's bottom-aligned), so the sign sits on the artwork itself
      var boxH = logo.offsetHeight, drawnH = Math.min(boxH, logo.offsetWidth * (logo.naturalHeight / logo.naturalWidth || 0) || boxH);
      var reach = .9 - (boxH - drawnH) / stage.offsetHeight;   // rig height at which the logo first touches the sign
      var keys = [], at = 0, from = REPS[0][1];
      REPS.forEach(function (r) { keys.push({ start: at, end: at + r[0] * SPEED, from: from, to: r[1], strain: !!r[2] }); at += r[0] * SPEED; from = r[1]; });
      var T_LOCK = keys[keys.length - 2].end, T_DROP = at, T_FLOOR = T_DROP + DROP * SPEED, T_REST = T_DROP + 150 * SPEED;
      var t0 = performance.now(), floored = false, launch = null;

      (function frame(now) {
        var t = now - t0, y = 0, jitterX = 0, jitterY = 0, stageY = 0;

        for (var i = 0; i < keys.length; i++) {
          var key = keys[i];
          if (t < key.end || i === keys.length - 1) {
            var k = Math.max(0, Math.min(1, (t - key.start) / (key.end - key.start)));
            y = key.from + (key.to - key.from) * ease(k);
            if (key.strain && t < key.end) { jitterX = Math.sin(t / 9) * 1.2; jitterY = Math.sin(t / 13) * .006; }
            break;
          }
        }
        y += jitterY;

        // the sign rides on top of the logo; the final press throws it off the top
        var signY, signRot = 0, signX = 0;
        if (t < T_LOCK - 120 * SPEED) {
          signY = Math.min(0, y - reach);
          if (y < reach) signX = jitterX;
        } else {
          if (!launch) launch = t;
          var f = (t - launch) / (500 * SPEED);
          signY = Math.min(0, y - reach) - 1.2 * f * f - .5 * f;
          signRot = -14 * f;
          signX = 18 * f;
        }

        // lockout held; the bar drops away and hits the floor below the frame
        var barY = 0;
        if (t > T_DROP) {
          var d = Math.min(1, (t - T_DROP) / (T_FLOOR - T_DROP));
          barY = d * d * 260;
          if (d >= 1 && !floored) { floored = true; dust(el); }
        }
        // once the bar is gone, the logo settles into the middle of the frame
        var rest = t > T_REST ? ease(Math.min(1, (t - T_REST) / (400 * SPEED))) * SETTLE : 0;
        if (floored) stageY = 3 * Math.exp(-(t - T_FLOOR) / 80) * Math.abs(Math.cos((t - T_FLOOR) / 25));

        rig.style.transform = 'translate(' + jitterX + 'px,' + ((y + rest) * 100) + '%)';
        barbell.style.transform = 'translateY(' + barY + '%) rotate(' + (barY / 260 * 2) + 'deg)';
        sign.style.transform = 'translate(' + signX + 'px,' + (signY * 100 / .92) + '%) rotate(' + signRot + 'deg)';
        stage.style.transform = stageY ? 'translateY(' + stageY + 'px)' : '';

        if (t < T_FLOOR + 600) requestAnimationFrame(frame);
        else { rig.style.transform = 'translateY(' + SETTLE * 100 + '%)'; stage.style.transform = ''; sign.style.display = barbell.style.display = 'none'; }
      })(t0);
    }

    document.querySelectorAll('[data-spv-press]:not([data-spv-ready])').forEach(function (el) {
      el.setAttribute('data-spv-ready', '');
      if (reduce) return;
      if (!('IntersectionObserver' in window)) { play(el); return; }
      var timer;
      var io = new IntersectionObserver(function (entries) {
        // only start once it's (almost) fully on screen; cancel if they scroll past first
        if (entries[0].intersectionRatio >= .95) {
          timer = timer || setTimeout(function () { io.disconnect(); play(el); }, HOLD_MS);
        } else {
          clearTimeout(timer); timer = null;
        }
      }, { threshold: [0, .95, 1] });
      io.observe(el.querySelector('.spv-press__stage'));
    });
  })();
</script>
