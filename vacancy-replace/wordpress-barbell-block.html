<div class="spv-lift" data-spv-lift>
  <div class="spv-lift__stage">
    <div class="spv-lift__sign">
      <span class="spv-lift__small">Space</span>
      <span class="spv-lift__big">Available</span>
    </div>
    <div class="spv-lift__rig">
      <svg class="spv-lift__barbell" viewBox="0 0 1000 250" aria-hidden="true">
        <defs>
          <linearGradient id="spvSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset=".45" stop-color="#a9afb6"/><stop offset=".55" stop-color="#8b9199"/><stop offset="1" stop-color="#4c5157"/></linearGradient>
          <linearGradient id="spvChrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#cfd4d9"/><stop offset=".6" stop-color="#7d838a"/><stop offset="1" stop-color="#3e4247"/></linearGradient>
          <linearGradient id="spvRubber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#151618"/><stop offset=".3" stop-color="#34373b"/><stop offset=".55" stop-color="#26282b"/><stop offset="1" stop-color="#0e0f10"/></linearGradient>
          <pattern id="spvKnurl" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H4" stroke="rgba(0,0,0,.28)" stroke-width="1"/></pattern>
        </defs>
        <ellipse cx="500" cy="246" rx="470" ry="5" fill="rgba(0,0,0,.18)"/>
        <!-- shaft with knurling -->
        <rect x="190" y="118" width="620" height="14" fill="url(#spvSteel)"/>
        <rect x="300" y="118" width="170" height="14" fill="url(#spvKnurl)"/>
        <rect x="530" y="118" width="170" height="14" fill="url(#spvKnurl)"/>
        <!-- sleeves -->
        <rect x="14" y="111" width="176" height="28" rx="3" fill="url(#spvChrome)"/>
        <rect x="810" y="111" width="176" height="28" rx="3" fill="url(#spvChrome)"/>
        <!-- inner collars -->
        <rect x="186" y="101" width="12" height="48" rx="2" fill="url(#spvChrome)"/>
        <rect x="802" y="101" width="12" height="48" rx="2" fill="url(#spvChrome)"/>
        <!-- 45 lb plates -->
        <rect x="144" y="4" width="40" height="242" rx="7" fill="url(#spvRubber)"/>
        <rect x="816" y="4" width="40" height="242" rx="7" fill="url(#spvRubber)"/>
        <!-- 25 lb plates -->
        <rect x="110" y="42" width="31" height="166" rx="6" fill="url(#spvRubber)"/>
        <rect x="859" y="42" width="31" height="166" rx="6" fill="url(#spvRubber)"/>
        <!-- spring clips -->
        <rect x="94" y="107" width="13" height="36" rx="3" fill="#2a2c2f"/>
        <rect x="893" y="107" width="13" height="36" rx="3" fill="#2a2c2f"/>
        <!-- plate edge highlights -->
        <path d="M150 12V238M822 12V238M116 50V200M865 50V200" stroke="rgba(255,255,255,.07)" stroke-width="3"/>
      </svg>
      <img class="spv-lift__logo" src="/wp-content/uploads/2026/09/Powerhouse-Logo.png" alt="Powerhouse Gym">
    </div>
  </div>
  <canvas class="spv-lift__fx" aria-hidden="true"></canvas>
</div>
<style>
  .spv-lift { position: relative; max-width: 360px; margin: 0 auto 24px; }
  .spv-lift__stage { position: relative; aspect-ratio: 2 / 1; }
  .spv-lift__sign { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; border: 2px dashed #b5b9be; border-radius: 4px; background: #f4f5f6; color: #8a8f96; text-transform: uppercase; line-height: 1; transform-origin: 50% 100%; }
  .spv-lift__sign::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, 0) 75%); opacity: var(--spv-shadow, 0); pointer-events: none; }
  .spv-lift__small { font-size: 13px; letter-spacing: .35em; font-weight: 600; }
  .spv-lift__big { font-size: clamp(26px, 6vw, 40px); font-weight: 800; letter-spacing: .06em; margin-top: 8px; }
  .spv-lift__rig { position: absolute; inset: 0; opacity: 0; }
  .spv-lift__barbell { position: absolute; left: 0; bottom: 0; width: 100%; height: 50%; overflow: visible; transform-origin: 50% 100%; }
  .spv-lift__logo { position: absolute; left: 19%; top: 0; width: 62%; height: 100%; object-fit: contain; object-position: 50% 100%; margin: 0; z-index: 1; transform-origin: 50% 100%; transform: translateY(-26.4%); }
  .spv-lift__fx { position: absolute; left: 0; top: -50%; width: 100%; height: 180%; pointer-events: none; z-index: 3; }
  @media (prefers-reduced-motion: reduce) {
    .spv-lift__sign, .spv-lift__barbell { display: none; }
    .spv-lift__rig { opacity: 1; }
    .spv-lift__logo { transform: none; }
  }
</style>
<script>
  (function () {
    var HOLD_MS = 1000;   // how long it must be fully in view before the drop starts
    var SPEED = 1;        // 1.5 = everything 50% slower, 0.8 = faster

    // Timeline (ms): rumble, fall, press on the sign, smash through, land,
    // then the logo hops off the bar, the barbell rolls away and the logo sets down.
    var RUMBLE = 500 * SPEED, FALL = 1100 * SPEED, PUSH = 220 * SPEED, SMASH = 170 * SPEED;
    var SETTLE = 650 * SPEED, HOP = 260 * SPEED, DROP = 300 * SPEED, ROLL = 1100 * SPEED;
    var T_FALL = RUMBLE, T_CONTACT = T_FALL + FALL, T_PUSH = T_CONTACT + PUSH, T_IMPACT = T_PUSH + SMASH;
    var T_HOP = T_IMPACT + SETTLE, T_DROP = T_HOP + HOP, T_SET = T_DROP + DROP, T_END = Math.max(T_HOP + ROLL, T_SET + 500);
    var START_Y = -2.6;   // starts 2.6 stage-heights above its resting place
    var ON_BAR = -.264;   // the logo rides on top of the bar (fraction of its height)
    var HOP_HEIGHT = -.14;

    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    function reachOf(el) {
      // how far past its sides the block may draw without going off screen
      var box = el.getBoundingClientRect(), vw = document.documentElement.clientWidth, reach = box.width * .35;
      return { w: box.width, l: Math.max(0, Math.min(reach, box.left - 2)), r: Math.max(0, Math.min(reach, vw - box.right - 2)) };
    }

    function dust(el, mode) {
      var canvas = el.querySelector('.spv-lift__fx');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var room = reachOf(el), lw = room.w;
      canvas.style.left = -room.l + 'px';
      canvas.style.width = (lw + room.l + room.r) + 'px';
      var w = canvas.offsetWidth, h = canvas.offsetHeight;
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var s = lw / 360;
      var ground = h * (1.5 / 1.8);   // stage bottom inside the canvas
      var top = h * (0.5 / 1.8);      // stage top inside the canvas
      var cx = room.l + lw / 2;
      var puffs = [], chips = [];
      var chipColors = ['#b5b9be', '#8a8f96', '#d9dcdf', '#9ea3a9'];

      function chip(x, y, dir, power) {
        chips.push({ x: x, y: y, vx: dir * (1 + Math.random() * 3.5) * s * power, vy: -(1.5 + Math.random() * 4.5) * s * power,
          r: Math.random() * 6, vr: (Math.random() - .5) * .5, size: (2 + Math.random() * 4) * s,
          color: chipColors[Math.floor(Math.random() * chipColors.length)], life: 1, bounced: false });
      }
      function puff(x, dir, speed, size, alpha) {
        puffs.push({ x: x, y: ground - Math.random() * 10 * s, vx: dir * speed * s, vy: -(0.3 + Math.random() * 1.8) * s,
          r: size * s, grow: (.25 + Math.random() * .35) * s, a: alpha, life: 1, decay: .005 + Math.random() * .006 });
      }

      if (mode === 'crack') {
        for (var i = 0; i < 10; i++) chip(cx + (Math.random() - .5) * lw * .9, top + 4, Math.random() < .5 ? -1 : 1, .6);
      } else if (mode === 'impact') {
        for (var j = 0; j < 110; j++) {
          var side = Math.random() < .5 ? -1 : 1, off = Math.random();
          puff(cx + side * off * lw * .5, side, 1.5 + off * 4 + Math.random() * 3, 5 + Math.random() * 10, .3 + Math.random() * .25);
        }
        for (var k = 0; k < 34; k++) chip(cx + (Math.random() - .5) * lw * .95, ground - 4, Math.random() < .5 ? -1 : 1, 1);
      } else {
        // a light puff where the logo sets down
        for (var m = 0; m < 24; m++) {
          var d = Math.random() < .5 ? -1 : 1;
          puff(cx + d * Math.random() * lw * .3, d, 1 + Math.random() * 2.5, 3 + Math.random() * 5, .2);
        }
      }

      (function frame() {
        ctx.clearRect(0, 0, w, h);
        for (var i = puffs.length - 1; i >= 0; i--) {
          var p = puffs[i];
          p.vx *= .955; p.vy = p.vy * .975 - .012 * s;
          p.x += p.vx; p.y += p.vy; p.r += p.grow; p.life -= p.decay;
          if (p.life <= 0) { puffs.splice(i, 1); continue; }
          var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
          g.addColorStop(0, 'rgba(158,146,128,' + (p.a * p.life) + ')');
          g.addColorStop(1, 'rgba(158,146,128,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        for (var c = chips.length - 1; c >= 0; c--) {
          var q = chips[c];
          q.vy += .28 * s; q.vx *= .99;
          q.x += q.vx; q.y += q.vy; q.r += q.vr;
          if (q.y > ground && !q.bounced) { q.y = ground; q.vy *= -.3; q.vx *= .5; q.bounced = true; }
          if (q.bounced) q.life -= .02;
          if (q.life <= 0 || q.y > h) { chips.splice(c, 1); continue; }
          ctx.save(); ctx.globalAlpha = q.life; ctx.fillStyle = q.color;
          ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.fillRect(-q.size / 2, -q.size / 3, q.size, q.size * .66);
          ctx.restore();
        }
        if (puffs.length || chips.length) requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, w, h);
      })();
    }

    function play(el) {
      var stage = el.querySelector('.spv-lift__stage');
      var sign = el.querySelector('.spv-lift__sign');
      var rig = el.querySelector('.spv-lift__rig');
      var barbell = el.querySelector('.spv-lift__barbell');
      var logo = el.querySelector('.spv-lift__logo');
      var t0 = performance.now(), cracked = false, landed = false, set = false;

      function clamp(k) { return k < 0 ? 0 : k > 1 ? 1 : k; }

      (function frame(now) {
        var t = now - t0, y, k;
        var signSX = 1, signX = 0, shadow = 0, squash = 0, stageX = 0, stageY = 0, rigOpacity = 1;

        if (t < T_FALL) {                       // rumble: something heavy is coming
          k = t / RUMBLE;
          y = START_Y; rigOpacity = 0;
          shadow = .25 * k; signX = Math.sin(t / 16) * 1.5 * k;
        } else if (t < T_CONTACT) {             // falling, accelerating
          k = (t - T_FALL) / FALL;
          y = START_Y + (-1 - START_Y) * k * k;
          rigOpacity = Math.min(1, k * 4);
          shadow = .25 + .6 * k; signX = Math.sin(t / 12) * 2.5 * k;
        } else if (t < T_PUSH) {                // the plates land on the sign; the sign resists
          k = (t - T_CONTACT) / PUSH; k = 1 - (1 - k) * (1 - k);
          y = -1 + .12 * k;
          signSX = 1 + .03 * k; shadow = .85;
          stageX = Math.sin(t / 7) * 2;
          if (!cracked) { cracked = true; dust(el, 'crack'); }
        } else if (t < T_IMPACT) {              // it smashes through
          k = (t - T_PUSH) / SMASH; k = k * k;
          y = -.88 + .88 * k;
          signSX = 1.03 + .1 * k; shadow = .85;
        } else {                                // impact: shake and dust
          k = t - T_IMPACT;
          y = 0; signSX = 1.13;
          var decay = Math.exp(-k / 160);
          stageX = Math.sin(k / 11) * 7 * decay;
          stageY = Math.abs(Math.cos(k / 14)) * 5 * decay;
          if (t < T_HOP) squash = .07 * Math.exp(-k / 110) * Math.cos(k / 50);   // logo flexes on the bar
          if (!landed) { landed = true; dust(el, 'impact'); }
        }

        // after landing: the logo hops off the bar, then sets down on the ground
        var logoY = ON_BAR;
        if (t >= T_HOP && t < T_DROP) {
          k = clamp((t - T_HOP) / HOP); k = 1 - (1 - k) * (1 - k);
          logoY = ON_BAR + HOP_HEIGHT * k;
        } else if (t >= T_DROP && t < T_SET) {
          k = clamp((t - T_DROP) / DROP); k = k * k;
          logoY = (ON_BAR + HOP_HEIGHT) * (1 - k);
        } else if (t >= T_SET) {
          logoY = 0;
          squash = .06 * Math.exp(-(t - T_SET) / 90) * Math.cos((t - T_SET) / 45);
          if (!set) { set = true; dust(el, 'set'); }
        }

        // the barbell rolls away from the viewer: it drifts up, shrinks and fades behind the logo
        var roll = clamp((t - T_HOP) / ROLL), r2 = roll * roll;
        barbell.style.transform = 'translateY(' + (-r2 * 60) + '%) scale(' + (1 - .45 * r2) + ')';
        barbell.style.opacity = roll ? Math.max(0, 1 - r2 * 1.1) : 1;
        barbell.style.filter = roll ? 'blur(' + (r2 * 1.5) + 'px)' : '';

        // the sign's top edge follows the plates' bottom edge, so it's crushed flat
        var signSY = Math.max(0.02, Math.min(1, -y));

        rig.style.opacity = rigOpacity;
        rig.style.transform = 'translateY(' + (y * 100) + '%)';
        logo.style.transform = 'translateY(' + (logoY * 100) + '%) scale(' + (1 + squash * .6) + ',' + (1 - squash) + ')';
        sign.style.transform = 'translateX(' + signX + 'px) scale(' + signSX + ',' + signSY + ')';
        sign.style.setProperty('--spv-shadow', shadow);
        if (t > T_IMPACT) sign.style.opacity = Math.max(0, 1 - (t - T_IMPACT) / 250);
        stage.style.transform = 'translate(' + stageX + 'px,' + stageY + 'px)';

        if (t < T_END) requestAnimationFrame(frame);
        else {
          rig.style.transform = stage.style.transform = '';
          logo.style.transform = 'none';
          sign.style.display = barbell.style.display = 'none';
        }
      })(t0);
    }

    document.querySelectorAll('[data-spv-lift]:not([data-spv-ready])').forEach(function (el) {
      el.setAttribute('data-spv-ready', '');
      if (reduce) return;
      if (!('IntersectionObserver' in window)) { play(el); return; }
      var timer;
      var io = new IntersectionObserver(function (entries) {
        // only start once it's (almost) fully on screen; cancel if they scroll past first
        if (entries[0].intersectionRatio >= .95) {
          timer = timer || setTimeout(function () { io.disconnect(); play(el); }, HOLD_MS);
        } else {
          clearTimeout(timer); timer = null;
        }
      }, { threshold: [0, .95, 1] });
      io.observe(el.querySelector('.spv-lift__stage'));
    });
  })();
</script>
