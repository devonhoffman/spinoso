#xlerator-interactive-stage .xl-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse 70% 60% at 50% 42%,rgba(255,255,255,.65),rgba(255,255,255,0) 70%),linear-gradient(to bottom,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 22%,rgba(0,0,0,0) 78%,rgba(0,0,0,.045) 100%) 0 0/var(--xl-t) calc(var(--xl-t)/2),linear-gradient(to bottom,var(--xl-grout) 0 var(--xl-g),transparent var(--xl-g)) 0 0/var(--xl-t) calc(var(--xl-t)/2),conic-gradient(from 0deg at var(--xl-g) 50%,transparent 0 75%,var(--xl-grout) 0) 0 0/var(--xl-t) var(--xl-t),conic-gradient(from 0deg at var(--xl-g) 50%,transparent 0 75%,var(--xl-grout) 0) calc(var(--xl-t)/2) calc(var(--xl-t)/2)/var(--xl-t) var(--xl-t),var(--xl-tile)}
#xlerator-interactive-stage .xl-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 85% 75% at 50% 45%,rgba(20,30,40,0) 55%,rgba(20,30,40,.16) 100%),linear-gradient(to bottom,rgba(255,255,255,0) 60%,rgba(20,30,40,.06) 100%)}
/* --- Product layers --- */
#xlerator-interactive-stage .xl-shadow{position:absolute;left:50%;top:50%;z-index:1;border-radius:6%;background:rgba(15,22,30,.28);filter:blur(18px);transform:translate(-50%,-50%);pointer-events:none;opacity:0}
#xlerator-interactive-stage .xl-layers{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s ease}
#xlerator-interactive-stage.is-ready .xl-layers{opacity:1}
#xlerator-interactive-stage .xl-layer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);will-change:transform}
#xlerator-interactive-stage .xl-float{position:relative;width:100%;height:100%;will-change:transform}
#xlerator-interactive-stage .xl-img{display:block;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;transition:opacity .3s ease;-webkit-user-drag:none}
#xlerator-interactive-stage .xl-hit{position:absolute;display:block;pointer-events:none}
#xlerator-interactive-stage.is-exploded .xl-hit{pointer-events:auto;cursor:pointer}
#xlerator-interactive-stage.has-focus .xl-layer:not(.is-focus) .xl-img{opacity:.35}
#xlerator-interactive-stage .xl-layer.is-focus{z-index:95!important}
/* --- Leader lines & labels --- */
#xlerator-interactive-stage .xl-lines{position:absolute;inset:0;z-index:3;width:100%;height:100%;overflow:visible;pointer-events:none}
#xlerator-interactive-stage .xl-lines polyline{fill:none;stroke:var(--xl-line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s ease}
#xlerator-interactive-stage .xl-lines circle{fill:var(--xl-accent);stroke:#fff;stroke-width:2}
#xlerator-interactive-stage .xl-lines polyline.is-focus{stroke:var(--xl-accent);stroke-width:2}
#xlerator-interactive-stage .xl-labels{position:absolute;inset:0;z-index:4;pointer-events:none}
#xlerator-interactive-stage .xl-card{position:absolute;left:0;top:0;display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(255,255,255,.94);border:1px solid rgba(22,32,42,.1);border-radius:10px;box-shadow:0 8px 24px -10px rgba(15,22,30,.35),0 2px 6px rgba(15,22,30,.06);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:15px;font-weight:600;letter-spacing:.01em;opacity:0;transition:border-color .25s ease,box-shadow .25s ease}
#xlerator-interactive-stage.is-exploded .xl-card{pointer-events:auto;cursor:default}
#xlerator-interactive-stage .xl-card-num{color:var(--xl-accent);font-weight:800;font-variant-numeric:tabular-nums}
#xlerator-interactive-stage .xl-card-name{padding-left:10px;border-left:1px solid rgba(22,32,42,.22)}
#xlerator-interactive-stage .xl-card.is-focus{border-color:var(--xl-accent);box-shadow:0 10px 28px -10px rgba(210,35,42,.45),0 2px 6px rgba(15,22,30,.08)}
#xlerator-interactive-stage.xl-compact .xl-card{gap:6px;padding:5px 8px;border-radius:7px;font-size:11px;white-space:normal;text-align:center;justify-content:center}
#xlerator-interactive-stage.xl-compact .xl-card-name{padding-left:6px}

#xlerator-interactive-stage .xl-controls{position:absolute;right:16px;bottom:16px;z-index:6;display:flex;gap:8px}
#xlerator-interactive-stage .xl-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid rgba(22,32,42,.14);box-shadow:0 4px 14px -6px rgba(15,22,30,.4);color:var(--xl-ink);cursor:pointer;transition:transform .2s ease,background .2s ease}
#xlerator-interactive-stage .xl-btn:hover{background:#fff;transform:translateY(-1px)}
#xlerator-interactive-stage .xl-btn:focus-visible{outline:2px solid var(--xl-accent);outline-offset:2px}
#xlerator-interactive-stage .xl-btn svg{display:block;width:16px;height:16px;fill:currentColor}
#xlerator-interactive-stage .xl-btn .xl-ico-play{display:none}
#xlerator-interactive-stage.is-paused .xl-btn .xl-ico-play{display:block}
#xlerator-interactive-stage.is-paused .xl-btn .xl-ico-pause{display:none}
#xlerator-interactive-stage .xl-loader{position:absolute;left:50%;top:50%;z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;transform:translate(-50%,-50%);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(22,32,42,.6);transition:opacity .4s ease}
#xlerator-interactive-stage .xl-loader::before{content:"";width:34px;height:34px;border-radius:50%;border:3px solid rgba(22,32,42,.12);border-top-color:var(--xl-accent);animation:xl-spin .9s linear infinite}
#xlerator-interactive-stage.is-ready .xl-loader{opacity:0;pointer-events:none}
#xlerator-interactive-stage .xl-sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@keyframes xl-spin{to{transform:rotate(360deg)}}
@media (max-width:480px){#xlerator-interactive-stage .xl-controls{right:10px;bottom:10px}#xlerator-interactive-stage .xl-btn{width:34px;height:34px}}

    }
    var cr = controlsEl.getBoundingClientRect(), rr = root.getBoundingClientRect();
    var ctrl = [cr.left - rr.left, cr.top - rr.top, cr.right - rr.left, cr.bottom - rr.top];
    // Largest scale with (almost) no overlap; otherwise the least-overlap scale.
    var sc = CONFIG.maxScale, best = sc, bestArea = Infinity, area, ok = W * H * 0.0008;
    for (;;) {
      area = place(sc);
      if (area < bestArea) { best = sc; bestArea = area; }
      if (area <= ok || sc <= CONFIG.minScale) break;
      sc = Math.max(CONFIG.minScale, sc * 0.95);
    }
    if (best !== sc) place(best);
    live.forEach(function (p) {
      var len = 0, pts = p.pl;
      for (var m = 1; m < pts.length; m++) len += Math.hypot(pts[m][0] - pts[m - 1][0], pts[m][1] - pts[m - 1][1]);
      p.len = Math.max(1, len);
      p.pts = pts.map(function (pt) { return pt[0].toFixed(1) + "," + pt[1].toFixed(1); }).join(" ");
    });
  }
  function applyBase() {
    linesEl.setAttribute("viewBox", "0 0 " + W + " " + H);
    live.forEach(function (p) {
      var s = p.el.style;
      s.width = p.dw + "px";
      s.height = p.dh + "px";
      s.marginLeft = p.offX + "px";
      s.marginTop = p.offY + "px";
      var origin = p.ox + "px " + p.oy + "px";
      gsap.set(p.el, { xPercent: -50, yPercent: -50, transformOrigin: origin });
      gsap.set(p.fl, { transformOrigin: origin });
      var b = p.box, hs = p.hit.style;
      hs.left = b.x * p.s0 + "px";
      hs.top = b.y * p.s0 + "px";
      hs.width = p.bw + "px";
      hs.height = p.bh + "px";
      p.line.setAttribute("points", p.pts);
      p.line.style.strokeDasharray = p.len;
      p.dot.setAttribute("cx", p.A[0]);
      p.dot.setAttribute("cy", p.A[1]);
      p.card.style.left = p.cl + "px";
      p.card.style.top = p.ct + "px";
    });
    var ss = shadowEl.style;
    ss.width = U.w * live[0].s0 * 0.86 + "px";
    ss.height = U.h * live[0].s0 * 0.9 + "px";
    ss.marginTop = Math.round(U.h * live[0].s0 * 0.04 + 10) + "px";
  }
  function els(key) { return live.map(function (p) { return p[key]; }); }
  function setAssembled() {
    live.forEach(function (p) {
      gsap.set(p.el, { x: 0, y: 0, scale: 1, rotation: 0 });
      gsap.set(p.line, { strokeDashoffset: p.len, opacity: 0 });
    });
    gsap.set(els("fl"), { y: 0, rotation: 0 });
    gsap.set(els("dot"), { opacity: 0 });
    gsap.set(els("card"), { opacity: 0, x: 0, y: 0 });
    gsap.set(shadowEl, { opacity: 1 });
  }
  function setExploded() {
    live.forEach(function (p) {
      gsap.set(p.el, { x: p.sx - p.cx, y: p.sy - p.cy, scale: p.sc });
      gsap.set(p.line, { strokeDashoffset: 0, opacity: 1 });
    });
    gsap.set(els("dot"), { opacity: 1, scale: 1 });
    gsap.set(els("card"), { opacity: 1, x: 0, y: 0 });
    gsap.set(shadowEl, { opacity: 0 });
  }
  // ---- Sequencing --------------------------------------------------------
  var T = { phase: null, floats: [], state: "idle", paused: false, offscreen: false };
  function syncPlayback() {
    var running = !T.paused && !T.offscreen;
    [T.phase].concat(T.floats).forEach(function (t) { if (t) running ? t.resume() : t.pause(); });
  }
  function run(tl) {
    if (T.phase && T.phase !== tl) T.phase.kill();
    T.phase = tl;
    syncPlayback();
    return tl;
  }
  function hold(sec, next) {
    run(gsap.timeline({ onComplete: next }).to({}, { duration: sec }));
  }
  function startFloats() {
    stopFloats();
    if (reduceMotion) return;
    T.floats = live.map(function (p, k) {
      return gsap.to(p.fl, {
        y: "+=8",
        rotation: k % 2 ? "-=1" : "+=1",
        duration: 2.1 + (k % 3) * 0.45,
        delay: k * 0.12,
        ease: "sine.inOut",
        yoyo: true,
        repeat: -1
      });
    });
    syncPlayback();
  }
  function stopFloats() {
    T.floats.forEach(function (t) { t.kill(); });
    T.floats = [];
  }
  function enterExploded() {
    T.state = "exploded";
    root.classList.add("is-exploded");
    startFloats();
    hold(CONFIG.inspect, reassemble);
  }
  function enterAssembled() {
    T.state = "assembled";
    if (CONFIG.loop) hold(CONFIG.holdAssembled, explode);
    else T.phase = null;
  }
  function explode() {
    T.state = "exploding";
    var tl = gsap.timeline({ onComplete: enterExploded });
    tl.to(shadowEl, { opacity: 0, duration: 0.8, ease: "power1.out" }, 0);
    live.forEach(function (p, k) {
      var t = k * CONFIG.explodeStagger, lt = t + CONFIG.explodeDur * 0.6;
      tl.to(p.el, { x: p.sx - p.cx, y: p.sy - p.cy, scale: p.sc, duration: CONFIG.explodeDur, ease: "power2.out" }, t);
      tl.fromTo(p.dot, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, lt);
      tl.fromTo(p.line, { strokeDashoffset: p.len, opacity: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, lt + 0.05);
      tl.fromTo(p.card, { opacity: 0, x: p.side * -12, y: p.side ? 0 : -6 }, { opacity: 1, x: 0, y: 0, duration: 0.45, ease: "power2.out" }, lt + 0.35);
    });
    run(tl);
  }
  function reassemble() {
    T.state = "reassembling";
    root.classList.remove("is-exploded");
    clearFocus();
    stopFloats();
    var tl = gsap.timeline({ onComplete: function () { setAssembled(); enterAssembled(); } });
    tl.to(els("card"), { opacity: 0, duration: 0.35, ease: "power1.in" }, 0);
    tl.to(els("line").concat(els("dot")), { opacity: 0, duration: 0.35, ease: "power1.in" }, 0);
    tl.to(els("fl"), { y: 0, rotation: 0, duration: 0.5, ease: "power1.out" }, 0);
    // Back-to-front: 01 Back Plate first ... 07 Dryer Cover last, on top.
    live.forEach(function (p, k) {
      tl.to(p.el, { x: 0, y: 0, scale: 1, rotation: 0, duration: CONFIG.returnDur, ease: "power3.inOut" }, 0.45 + k * CONFIG.returnStagger);
    });
    tl.to(shadowEl, { opacity: 1, duration: 0.8, ease: "power1.out" }, ">-0.5");
    run(tl);
  }
  function restart(delay) {
    if (T.phase) T.phase.kill();
    T.phase = null;
    stopFloats();
    root.classList.remove("is-exploded");
    clearFocus();
    setAssembled();
    T.state = "assembled";
    hold(delay, explode);
  }
  function relayout() {
    computeLayout();
    applyBase();
    switch (T.state) {
      case "exploded": setExploded(); break;
      case "exploding": setExploded(); enterExploded(); break;
      case "reassembling": stopFloats(); setAssembled(); enterAssembled(); break;
      default: setAssembled();
    }
  }
  // ---- Hover / tap focus -------------------------------------------------
  var focused = null;
  function setFocus(p) {
    if (focused === p) return;
    clearFocus();
    if (!p || !root.classList.contains("is-exploded")) return;
    focused = p;
    root.classList.add("has-focus");
    [p.el, p.card, p.line].forEach(function (e) { e.classList.add("is-focus"); });
  }
  function clearFocus() {
    if (!focused) return;
    [focused.el, focused.card, focused.line].forEach(function (e) { e.classList.remove("is-focus"); });
    root.classList.remove("has-focus");
    focused = null;
  }
  function bindFocus(p) {
    [p.hit, p.card].forEach(function (target) {
      target.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") setFocus(p); });
      target.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") clearFocus(); });
      target.addEventListener("click", function (e) { e.stopPropagation(); focused === p ? clearFocus() : setFocus(p); });
    });
  }
  root.addEventListener("click", function () { clearFocus(); });
  // ---- Controls ----------------------------------------------------------
  function setPaused(v) {
    T.paused = v;
    root.classList.toggle("is-paused", v);
    toggleBtn.setAttribute("aria-label", v ? "Play animation" : "Pause animation");
    syncPlayback();
  }
  toggleBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!gsap) return;
    if (!T.phase && T.state === "assembled") { setPaused(false); restart(0.3); return; }
    setPaused(!T.paused);
  });
  replayBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!gsap || T.state === "idle") return;
    setPaused(false);
    restart(0.6);
  });
  // ---- Init --------------------------------------------------------------
  Promise.all([loadGsap()].concat(parts.map(loadPart))).then(function (res) {
    gsap = res[0];
    live = parts.filter(function (p) { return p.ok; });
    if (!live.length) { root.querySelector(".xl-loader").textContent = "Images unavailable"; return; }
    live.forEach(bindFocus);
    computeLayout();
    applyBase();
    setAssembled();
    root.classList.add("is-ready");
    T.state = "assembled";
    var started = false;
    function start() { if (!started) { started = true; hold(CONFIG.holdAssembled, explode); } }
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        var visible = entries[entries.length - 1].isIntersecting;
        T.offscreen = !visible;
        if (visible) start();
        syncPlayback();
      }, { threshold: 0.25 }).observe(root);
    } else {
      start();
    }
    var timer = null, lastW = W, lastH = H;
    function onResize() {
      if (root.clientWidth === lastW && root.clientHeight === lastH) return;
      clearTimeout(timer);
      timer = setTimeout(function () {
        lastW = root.clientWidth;
        lastH = root.clientHeight;
        relayout();
      }, 120);
    }
    if ("ResizeObserver" in window) new ResizeObserver(onResize).observe(root);
    else window.addEventListener("resize", onResize);
  }).catch(function (err) {
    root.querySelector(".xl-loader").textContent = "Animation unavailable";
    if (window.console) console.warn("[XLERATOR]", err);
  });
})();
</script>
