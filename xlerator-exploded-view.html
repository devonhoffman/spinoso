        let A, C;
        if (p.side) {
          A = [X + p.side * hw * 0.45, Y - hh * 0.05];
          C = [X + p.side * (hw + gap), Y - hh * 0.22];
          p.pl = [A, [C[0] - p.side * elbow, C[1]], C];
          p.cl = p.side > 0 ? C[0] + 6 : C[0] - 6 - p.cw;
          p.ct = C[1] - p.ch / 2;
        } else {
          A = [X, Y + hh * 0.5];
          C = [X, Y + hh + gap];
          p.pl = [A, C];
          p.cl = C[0] - p.cw / 2;
          p.ct = C[1] + 4;
        }
        p.cl = Math.min(Math.max(p.cl, 6), W - 6 - p.cw);
        p.ct = Math.min(Math.max(p.ct, 6), H - 6 - p.ch);
        p.A = A;
        p.rPart = [X - hw, Y - hh, X + hw, Y + hh];
        p.rCard = [p.cl, p.ct, p.cl + p.cw, p.ct + p.ch];
      });
      if (!(rx > 0 && ry > 0)) return Infinity;
      // Total overlap area between parts, labels and the playback controls.
      const pad = 6;
      const ov = (r, s) => {
        const w = Math.min(r[2], s[2]) - Math.max(r[0], s[0]) + pad, h = Math.min(r[3], s[3]) - Math.max(r[1], s[1]) + pad;
        return w > 0 && h > 0 ? w * h : 0;
      };
      let area = 0;
      for (let i = 0; i < n; i++) {
        const p = live[i];
        area += ov(p.rCard, ctrl) + ov(p.rPart, ctrl);
        for (let j = 0; j < n; j++) {
          if (i === j) continue;
          const q = live[j];
          area += ov(p.rCard, q.rPart);
          if (j > i) area += ov(p.rPart, q.rPart) + ov(p.rCard, q.rCard);
        }
      }
      return area;
    }
    // Largest scale with (almost) no overlap; otherwise the least-overlap scale.
    const ok = W * H * 0.0008;
    let sc = CONFIG.maxScale, best = sc, bestArea = Infinity;
    for (;;) {
      const area = place(sc);
      if (area < bestArea) { best = sc; bestArea = area; }
      if (area <= ok || sc <= CONFIG.minScale) break;
      sc = Math.max(CONFIG.minScale, sc * 0.95);
    }
    if (best !== sc) place(best);
    live.forEach((p) => {
      const pts = p.pl;
      let len = 0;
      for (let m = 1; m < pts.length; m++) len += Math.hypot(pts[m][0] - pts[m - 1][0], pts[m][1] - pts[m - 1][1]);
      p.len = Math.max(1, len);
      p.pts = pts.map((pt) => pt[0].toFixed(1) + "," + pt[1].toFixed(1)).join(" ");
    });
  }
  function applyBase() {
    linesEl.setAttribute("viewBox", "0 0 " + W + " " + H);
    live.forEach((p) => {
      const s = p.el.style;
      s.width = p.dw + "px";
      s.height = p.dh + "px";
      s.marginLeft = p.offX + "px";
      s.marginTop = p.offY + "px";
      const origin = p.ox + "px " + p.oy + "px";
      gsap.set(p.el, { xPercent: -50, yPercent: -50, transformOrigin: origin });
      gsap.set(p.fl, { transformOrigin: origin });
      const b = p.box, hs = p.hit.style;
      hs.left = b.x * p.s0 + "px";
      hs.top = b.y * p.s0 + "px";
      hs.width = p.bw + "px";
      hs.height = p.bh + "px";
      p.line.setAttribute("points", p.pts);
      p.line.style.strokeDasharray = p.len;
      p.dot.setAttribute("cx", p.A[0]);
      p.dot.setAttribute("cy", p.A[1]);
      p.card.style.left = p.cl + "px";
      p.card.style.top = p.ct + "px";
    });
    const ss = shadowEl.style, s0 = live[0].s0;
    ss.width = U.w * s0 * 0.86 + "px";
    ss.height = U.h * s0 * 0.9 + "px";
    ss.marginTop = Math.round(U.h * s0 * 0.04 + 10) + "px";
  }
  const els = (key) => live.map((p) => p[key]);
  function setAssembled() {
    live.forEach((p) => {
      gsap.set(p.el, { x: 0, y: 0, scale: 1, rotation: 0 });
      gsap.set(p.line, { strokeDashoffset: p.len, opacity: 0 });
    });
    gsap.set(els("fl"), { y: 0, rotation: 0 });
    gsap.set(els("dot"), { opacity: 0 });
    gsap.set(els("card"), { opacity: 0, x: 0, y: 0 });
    gsap.set(shadowEl, { opacity: 1 });
  }
  function setExploded() {
    live.forEach((p) => {
      gsap.set(p.el, { x: p.sx - p.cx, y: p.sy - p.cy, scale: p.sc });
      gsap.set(p.line, { strokeDashoffset: 0, opacity: 1 });
    });
    gsap.set(els("dot"), { opacity: 1, scale: 1 });
    gsap.set(els("card"), { opacity: 1, x: 0, y: 0 });
    gsap.set(shadowEl, { opacity: 0 });
  }
  // ---- Sequencing --------------------------------------------------------
  const T = { phase: null, floats: [], state: "idle", paused: false, offscreen: false };
  function syncPlayback() {
    const running = !T.paused && !T.offscreen;
    [T.phase].concat(T.floats).forEach((t) => { if (t) running ? t.resume() : t.pause(); });
  }
  function run(tl) {
    if (T.phase && T.phase !== tl) T.phase.kill();
    T.phase = tl;
    syncPlayback();
    return tl;
  }
  function hold(sec, next) {
    run(gsap.timeline({ onComplete: next }).to({}, { duration: sec }));
  }
  function startFloats() {
    stopFloats();
    if (reduceMotion) return;
    T.floats = live.map((p, k) => gsap.to(p.fl, {
      y: "+=8",
      rotation: k % 2 ? "-=1" : "+=1",
      duration: 2.1 + (k % 3) * 0.45,
      delay: k * 0.12,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1
    }));
    syncPlayback();
  }
  function stopFloats() {
    T.floats.forEach((t) => t.kill());
    T.floats = [];
  }
  function enterExploded() {
    T.state = "exploded";
    root.classList.add("is-exploded");
    startFloats();
    hold(CONFIG.inspect, reassemble);
  }
  function enterAssembled() {
    T.state = "assembled";
    if (CONFIG.loop) hold(CONFIG.holdAssembled, explode);
    else T.phase = null;
  }
  function explode() {
    T.state = "exploding";
    const tl = gsap.timeline({ onComplete: enterExploded });
    tl.to(shadowEl, { opacity: 0, duration: 0.8, ease: "power1.out" }, 0);
    live.forEach((p, k) => {
      const t = k * CONFIG.explodeStagger, lt = t + CONFIG.explodeDur * 0.6;
      tl.to(p.el, { x: p.sx - p.cx, y: p.sy - p.cy, scale: p.sc, duration: CONFIG.explodeDur, ease: "power2.out" }, t);
      tl.fromTo(p.dot, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, lt);
      tl.fromTo(p.line, { strokeDashoffset: p.len, opacity: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut", immediateRender: false }, lt + 0.05);
      tl.fromTo(p.card, { opacity: 0, x: p.side * -12, y: p.side ? 0 : -6 }, { opacity: 1, x: 0, y: 0, duration: 0.45, ease: "power2.out" }, lt + 0.35);
    });
    run(tl);
  }
  function reassemble() {
    T.state = "reassembling";
    root.classList.remove("is-exploded");
    clearFocus();
    stopFloats();
    const tl = gsap.timeline({ onComplete: () => { setAssembled(); enterAssembled(); } });
    tl.to(els("card"), { opacity: 0, duration: 0.35, ease: "power1.in" }, 0);
    tl.to(els("line").concat(els("dot")), { opacity: 0, duration: 0.35, ease: "power1.in" }, 0);
    tl.to(els("fl"), { y: 0, rotation: 0, duration: 0.5, ease: "power1.out" }, 0);
    // Back-to-front: 01 Back Plate first ... 07 Dryer Cover last, on top.
    live.forEach((p, k) => {
      tl.to(p.el, { x: 0, y: 0, scale: 1, rotation: 0, duration: CONFIG.returnDur, ease: "power3.inOut" }, 0.45 + k * CONFIG.returnStagger);
    });
    tl.to(shadowEl, { opacity: 1, duration: 0.8, ease: "power1.out" }, ">-0.5");
    run(tl);
  }
  function restart(delay) {
    if (T.phase) T.phase.kill();
    T.phase = null;
    stopFloats();
    root.classList.remove("is-exploded");
    clearFocus();
    setAssembled();
    T.state = "assembled";
    hold(delay, explode);
  }
  function relayout() {
    computeLayout();
    applyBase();
    switch (T.state) {
      case "exploded": setExploded(); break;
      case "exploding": setExploded(); enterExploded(); break;
      case "reassembling": stopFloats(); setAssembled(); enterAssembled(); break;
      default: setAssembled();
    }
  }
  // ---- Hover / tap focus -------------------------------------------------
  let focused = null;
  function setFocus(p) {
    if (focused === p) return;
    clearFocus();
    if (!p || !root.classList.contains("is-exploded")) return;
    focused = p;
    root.classList.add("has-focus");
    p.el.style.zIndex = 95; // lift the focused part above its neighbours
    [p.el, p.card, p.line].forEach((e) => e.classList.add("is-focus"));
  }
  function clearFocus() {
    if (!focused) return;
    focused.el.style.zIndex = focused.L.z;
    [focused.el, focused.card, focused.line].forEach((e) => e.classList.remove("is-focus"));
    root.classList.remove("has-focus");
    focused = null;
  }
  function bindFocus(p) {
    [p.hit, p.card].forEach((target) => {
      target.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") setFocus(p); });
      target.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") clearFocus(); });
      target.addEventListener("click", (e) => { e.stopPropagation(); focused === p ? clearFocus() : setFocus(p); });
    });
  }
  root.addEventListener("click", () => clearFocus());
  // ---- Controls ----------------------------------------------------------
  function setPaused(v) {
    T.paused = v;
    root.classList.toggle("is-paused", v);
    toggleBtn.setAttribute("aria-label", v ? "Play animation" : "Pause animation");
    syncPlayback();
  }
  toggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!gsap) return;
    if (!T.phase && T.state === "assembled") { setPaused(false); restart(0.3); return; }
    setPaused(!T.paused);
  });
  replayBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!gsap || T.state === "idle") return;
    setPaused(false);
    restart(0.6);
  });
  // ---- Init --------------------------------------------------------------
  Promise.all([loadGsap()].concat(parts.map(loadPart))).then((res) => {
    gsap = res[0];
    live = parts.filter((p) => p.ok);
    if (!live.length) { loaderEl.textContent = "Images unavailable"; return; }
    live.forEach(bindFocus);
    computeLayout();
    applyBase();
    setAssembled();
    root.classList.add("is-ready");
    T.state = "assembled";
    let started = false;
    const start = () => { if (!started) { started = true; hold(CONFIG.holdAssembled, explode); } };
    if ("IntersectionObserver" in window) {
      new IntersectionObserver((entries) => {
        const visible = entries[entries.length - 1].isIntersecting;
        T.offscreen = !visible;
        if (visible) start();
        syncPlayback();
      }, { threshold: 0.25 }).observe(root);
    } else {
      start();
    }
    let timer = null, lastW = W, lastH = H;
    const onResize = () => {
      if (root.clientWidth === lastW && root.clientHeight === lastH) return;
      clearTimeout(timer);
      timer = setTimeout(() => {
        lastW = root.clientWidth;
        lastH = root.clientHeight;
        relayout();
      }, 120);
    };
    if ("ResizeObserver" in window) new ResizeObserver(onResize).observe(root);
    else window.addEventListener("resize", onResize);
  }).catch((err) => {
    loaderEl.textContent = "Animation unavailable";
    if (window.console) console.warn("[XLERATOR]", err);
  });
})();
</script>
</div>
