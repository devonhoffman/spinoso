<!-- Ingram Park Mall (San Antonio, TX) perimeter reveal: warm gray -> black & white -> gold outline draws -> pulse.
     The photo has a blue tint from old branding, so it starts as a warm-toned grayscale (see .mp-color) instead of full color.
     Image: aerial photo set in data-src below. data-zoom: how far to zoom in on the mall (1 = whole photo height). -->
<div id="ai-custom-widget-ingrampark-c9g5m1" data-src="https://spinosoreg.com/wp-content/uploads/2024/12/Property-Landing-Page-Hero-Ingram-Park-Mall.webp" data-min-height="360" data-zoom="2.2" role="img" aria-label="Aerial view of Ingram Park Mall in San Antonio, TX with its property boundary outlined in gold">
  <div class="mp-stage">
    <div class="mp-scene">
    <img class="mp-img mp-color" alt="" decoding="async">
    <img class="mp-img mp-bw" alt="" decoding="async" aria-hidden="true">
    <svg class="mp-svg" viewBox="0 0 2000 960" preserveAspectRatio="none" aria-hidden="true">
      <polygon class="mp-fill" points="823,251 912,236 919,259 984,259 1034,431 1078,433 1197,405 1214,451 1270,451 1280,496 1236,507 1239,563 1060,591 1078,692 951,710 928,629 875,632 870,646 826,646 821,624 795,625 789,635 694,651 691,664 656,671 630,664 599,492 701,479 719,489 738,481 725,399 847,379 842,350 818,355 815,332 824,324 816,267"/>
      <polygon class="mp-pulse" points="823,251 912,236 919,259 984,259 1034,431 1078,433 1197,405 1214,451 1270,451 1280,496 1236,507 1239,563 1060,591 1078,692 951,710 928,629 875,632 870,646 826,646 821,624 795,625 789,635 694,651 691,664 656,671 630,664 599,492 701,479 719,489 738,481 725,399 847,379 842,350 818,355 815,332 824,324 816,267"/>
      <polygon class="mp-line" points="823,251 912,236 919,259 984,259 1034,431 1078,433 1197,405 1214,451 1270,451 1280,496 1236,507 1239,563 1060,591 1078,692 951,710 928,629 875,632 870,646 826,646 821,624 795,625 789,635 694,651 691,664 656,671 630,664 599,492 701,479 719,489 738,481 725,399 847,379 842,350 818,355 815,332 824,324 816,267"/>
      <g class="mp-dot" transform="translate(693,-30)">
        <g class="mp-dot-size">
          <circle class="mp-dot-ring" r="9"/>
          <circle class="mp-dot-core" r="9"/>
        </g>
      </g>
    </svg>
    </div>
  </div>
</div>

<style>
#ai-custom-widget-ingrampark-c9g5m1 {
  --mp-gold: #e0a93b;
  --mp-fade: 1.6s;
  --mp-sw: 6;          /* line width in SVG units; JS keeps it ~6 screen px */
  position: relative;
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-height: 360px;
  line-height: 0;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #2a2a2a;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-scene {
  position: absolute;
  left: 0;
  top: 0;
  width: 2000px;
  height: 960px;
  transform-origin: 0 0;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  object-fit: cover;
}
/* Opening look: hides the photo's blue tint with a warm-toned grayscale */
#ai-custom-widget-ingrampark-c9g5m1 .mp-color {
  filter: grayscale(1) sepia(0.35) brightness(1.02);
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-bw {
  filter: grayscale(1) brightness(1.12) contrast(0.92);
  opacity: 0;
  transition: opacity var(--mp-fade) ease-in-out;
}
#ai-custom-widget-ingrampark-c9g5m1.mp-is-bw .mp-bw {
  opacity: 1;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-line,
#ai-custom-widget-ingrampark-c9g5m1 .mp-pulse {
  fill: none;
  stroke: var(--mp-gold);
  stroke-linejoin: round;
  stroke-linecap: round;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-line {
  stroke-width: var(--mp-sw);
  opacity: 0;
  filter: drop-shadow(0 0 3px rgba(224, 169, 59, 0.55));
}
#ai-custom-widget-ingrampark-c9g5m1.mp-is-drawing .mp-line {
  opacity: 1;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-dot {
  opacity: 0;
  transition: opacity 0.4s ease;
}
#ai-custom-widget-ingrampark-c9g5m1.mp-is-dropping .mp-dot {
  opacity: 1;
}
#ai-custom-widget-ingrampark-c9g5m1.mp-is-done .mp-dot {
  opacity: 0;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-dot-core {
  fill: var(--mp-gold);
  stroke: #fff;
  stroke-width: 2.5;
  filter: drop-shadow(0 0 6px rgba(224, 169, 59, 0.9));
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-dot-ring {
  fill: none;
  stroke: var(--mp-gold);
  stroke-width: 3;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}
#ai-custom-widget-ingrampark-c9g5m1.mp-is-landed .mp-dot-ring {
  animation: mp-land-c9g5m1 0.9s ease-out 1;
}
@keyframes mp-land-c9g5m1 {
  0%   { opacity: 0.95; transform: scale(1); }
  100% { opacity: 0;    transform: scale(3.4); }
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-pulse {
  stroke-width: var(--mp-sw);
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}
#ai-custom-widget-ingrampark-c9g5m1 .mp-fill {
  fill: var(--mp-gold);
  stroke: none;
  opacity: 0;
}
#ai-custom-widget-ingrampark-c9g5m1.mp-is-done .mp-line {
  filter: drop-shadow(0 0 4px rgba(224, 169, 59, 0.7));
  animation: mp-line-pulse-c9g5m1 1.1s ease-out 1;
}
#ai-custom-widget-ingrampark-c9g5m1.mp-is-done .mp-pulse {
  animation: mp-ring-c9g5m1 1.1s ease-out 1;
}
#ai-custom-widget-ingrampark-c9g5m1.mp-is-done .mp-fill {
  animation: mp-fill-c9g5m1 1.1s ease-out 1;
}
@keyframes mp-line-pulse-c9g5m1 {
  0%   { stroke-width: var(--mp-sw); }
  30%  { stroke-width: calc(var(--mp-sw) * 1.6); }
  100% { stroke-width: var(--mp-sw); }
}
@keyframes mp-ring-c9g5m1 {
  0%   { opacity: 0.9; stroke-width: var(--mp-sw);                 transform: scale(1); }
  100% { opacity: 0;   stroke-width: calc(var(--mp-sw) * 2.6);     transform: scale(1.06); }
}
@keyframes mp-fill-c9g5m1 {
  0%   { opacity: 0; }
  30%  { opacity: 0.22; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #ai-custom-widget-ingrampark-c9g5m1 .mp-bw,
  #ai-custom-widget-ingrampark-c9g5m1 .mp-dot { transition: none; }
  #ai-custom-widget-ingrampark-c9g5m1.mp-is-landed .mp-dot-ring,
  #ai-custom-widget-ingrampark-c9g5m1.mp-is-done .mp-line,
  #ai-custom-widget-ingrampark-c9g5m1.mp-is-done .mp-pulse,
  #ai-custom-widget-ingrampark-c9g5m1.mp-is-done .mp-fill { animation: none; }
}
</style>

<script>
(function () {
  const root = document.querySelector('#ai-custom-widget-ingrampark-c9g5m1');
  if (!root || root.dataset.mpInit) return;
  root.dataset.mpInit = '1';

  // Timing (ms)
  const HOLD_COLOR = 1200;   // how long the warm-gray opening shows first
  const FADE = 1600;         // matches --mp-fade
  const DROP = 1800;         // gold dot drifting down to the start point
  const LAND_PAUSE = 500;    // beat after the dot lands, before tracing
  const DRAW = 3000;         // tracing the perimeter

  // Photo size the outline coordinates are drawn against
  const IMG_W = 2000;
  const IMG_H = 960;
  const LINE_PX = 6;         // on-screen thickness of the gold line
  const DOT_PX = 9;          // on-screen radius of the gold dot

  const src = root.getAttribute('data-src');
  const minHeight = parseInt(root.getAttribute('data-min-height'), 10) || 360;
  const zoom = Math.max(1, parseFloat(root.getAttribute('data-zoom')) || 1);
  const stage = root.querySelector('.mp-stage');
  const scene = root.querySelector('.mp-scene');
  const imgColor = root.querySelector('.mp-color');
  const imgBw = root.querySelector('.mp-bw');
  const line = root.querySelector('.mp-line');
  const dot = root.querySelector('.mp-dot');
  const reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dotSize = root.querySelector('.mp-dot-size');
  imgColor.src = src;
  imgBw.src = src;

  // ---- Responsive sizing -------------------------------------------------
  // Height: fill the Elementor container (panel) this widget sits in.
  // Width: whatever the column gives us. The photo always fills the full height;
  // anything that doesn't fit is cropped off the sides, keeping the mall centered.
  // Zoom: crops in closer around the mall, but never so far that the outline
  // would be cut off, and never so little that the photo leaves empty space.
  const host = root.closest('.e-con, .elementor-column, .elementor-widget-wrap') || root.parentElement;
  const bbox = line.getBBox();
  const focusX = bbox.x + bbox.width / 2;
  const focusY = bbox.y + bbox.height / 2;
  let scale = 1;
  let offsetY = 0;

  function fitHeight() {
    if (!host) return;
    root.style.height = minHeight + 'px';            // collapse so the panel shows its own height
    const cs = getComputedStyle(host);
    const avail = host.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let h = avail;
    if (h <= minHeight + 1) {
      // Nothing beside us sets a height (e.g. columns stacked on mobile): use a pleasant ratio.
      h = Math.min(640, Math.max(minHeight, root.clientWidth * 0.8));
    }
    root.style.height = Math.round(h) + 'px';
  }

  function layout() {
    const W = stage.clientWidth;
    const H = stage.clientHeight;
    if (!W || !H) return;
    const cover = Math.max(W / IMG_W, H / IMG_H);   // never any empty space
    const fitOutline = Math.min(0.85 * W / bbox.width, 0.85 * H / bbox.height);
    scale = Math.max(cover, Math.min(cover * zoom, fitOutline));
    const clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };
    // Center on the mall, but never pull a photo edge into view
    const x = clamp(W / 2 - focusX * scale, W - IMG_W * scale, 0);
    const y = clamp(H / 2 - focusY * scale, H - IMG_H * scale, 0);
    offsetY = y;
    scene.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + scale.toFixed(4) + ')';
    root.style.setProperty('--mp-sw', (LINE_PX / scale).toFixed(2));
    dotSize.setAttribute('transform', 'scale(' + (DOT_PX / 9 / scale).toFixed(3) + ')');
  }

  let raf = 0;
  function refresh() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () { fitHeight(); layout(); });
  }
  fitHeight();
  layout();
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(refresh);
    ro.observe(root);
    if (host) ro.observe(host);
  }
  window.addEventListener('resize', refresh);

  const len = Math.ceil(line.getTotalLength());
  line.style.strokeDasharray = len + ' ' + len;
  line.style.strokeDashoffset = String(len);

  const start = line.getPointAtLength(0);
  let DROP_FROM = -30; // recalculated to just above the visible top edge

  function moveDot(x, y) {
    dot.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')');
  }
  moveDot(start.x, DROP_FROM);

  const easeOutCubic = function (t) { return 1 - Math.pow(1 - t, 3); };
  const easeInOutCubic = function (t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  };

  function tween(duration, ease, onFrame, onDone) {
    const t0 = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      onFrame(ease(t));
      if (t < 1) requestAnimationFrame(frame);
      else if (onDone) onDone();
    }
    requestAnimationFrame(frame);
  }

  function dropDot(done) {
    DROP_FROM = (-offsetY - 40) / scale;
    moveDot(start.x, DROP_FROM);
    root.classList.add('mp-is-dropping');
    tween(DROP, easeOutCubic, function (k) {
      moveDot(start.x, DROP_FROM + (start.y - DROP_FROM) * k);
    }, function () {
      root.classList.add('mp-is-landed');
      setTimeout(done, LAND_PAUSE);
    });
  }

  function trace(done) {
    root.classList.add('mp-is-drawing');
    tween(DRAW, easeInOutCubic, function (k) {
      const d = len * k;
      line.style.strokeDashoffset = String(len - d);
      const pt = line.getPointAtLength(Math.min(d, len - 0.01));
      moveDot(pt.x, pt.y);
    }, done);
  }

  function finish() {
    line.style.strokeDashoffset = '0';
    root.classList.add('mp-is-done');
  }

  let started = false;
  function play() {
    if (started) return;
    started = true;
    if (reduceMotion) {
      root.classList.add('mp-is-bw', 'mp-is-drawing');
      finish();
      return;
    }
    setTimeout(function () {
      root.classList.add('mp-is-bw');
      setTimeout(function () {
        dropDot(function () { trace(finish); });
      }, FADE * 0.8);
    }, HOLD_COLOR);
  }

  function startWhenReady() {
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { io.disconnect(); play(); }
        });
      }, { threshold: 0.4 });
      io.observe(root);
    } else {
      play();
    }
  }

  if (imgColor.complete && imgColor.naturalWidth) startWhenReady();
  else {
    imgColor.addEventListener('load', startWhenReady, { once: true });
    imgColor.addEventListener('error', startWhenReady, { once: true });
  }
})();
</script>
